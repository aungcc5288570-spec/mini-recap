name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix ic_launcher_background.xml and generate missing assets
        run: |
          mkdir -p app/src/main/res/drawable
          python3 -c 'import base64; open("app/src/main/res/drawable/ic_launcher_background.xml","wb").write(base64.b64decode(""))'
          python3 -m pip install --upgrade pip pillow fonttools
          python3 - <<'EOF'
          import os
          from PIL import Image
          from fontTools.fontBuilder import FontBuilder
          from fontTools.pens.ttGlyphPen import TTGlyphPen

          art_path = "app/src/main/res/drawable/img_launcher_art.png"
          if not os.path.exists(art_path):
              Image.new("RGBA", (512, 512), (17, 21, 26, 255)).save(art_path)

          mipmap_dirs = [
              "app/src/main/res/mipmap-mdpi",
              "app/src/main/res/mipmap-hdpi",
              "app/src/main/res/mipmap-xhdpi",
              "app/src/main/res/mipmap-xxhdpi",
              "app/src/main/res/mipmap-xxxhdpi",
          ]
          for d in mipmap_dirs:
              os.makedirs(d, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png"]:
                  p = os.path.join(d, name)
                  if not os.path.exists(p):
                      Image.new("RGBA", (192, 192), (30, 41, 59, 255)).save(p)

          font_dir = "app/src/main/res/font"
          os.makedirs(font_dir, exist_ok=True)
          font_names = [
              "jetbrains_mono.ttf",
              "noto_sans_myanmar.ttf",
              "noto_serif_myanmar.ttf",
              "padauk.ttf",
              "plus_jakarta_sans.ttf",
          ]

          def make_minimal_ttf(out_path, family_name):
              fb = FontBuilder(1000, isTTF=True)
              glyph_order = [".notdef", "space"]
              fb.setupGlyphOrder(glyph_order)

              pen = TTGlyphPen(None)
              pen.moveTo((100, 0))
              pen.lineTo((100, 700))
              pen.lineTo((500, 700))
              pen.lineTo((500, 0))
              pen.closePath()
              notdef_glyph = pen.glyph()

              space_pen = TTGlyphPen(None)
              space_glyph = space_pen.glyph()

              fb.setupGlyf({".notdef": notdef_glyph, "space": space_glyph})
              fb.setupCharacterMap({32: "space"})
              fb.setupHorizontalMetrics({
                  ".notdef": (600, 100),
                  "space": (400, 0),
              })
              fb.setupHorizontalHeader(ascent=800, descent=-200)
              fb.setupNameTable({
                  "familyName": family_name,
                  "styleName": "Regular",
              })
              fb.setupOS2(
                  sTypoAscender=800,
                  sTypoDescender=-200,
                  sTypoLineGap=100,
                  usWinAscent=800,
                  usWinDescent=200,
              )
              fb.setupPost()
              fb.save(out_path)

          for fname in font_names:
              fpath = os.path.join(font_dir, fname)
              if not os.path.exists(fpath):
                  make_minimal_ttf(fpath, os.path.splitext(fname)[0])
          EOF

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --no-configuration-cache
          else
            gradle assembleDebug --no-daemon --no-configuration-cache
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-recap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
