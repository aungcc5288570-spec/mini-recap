name: Build Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix broken XML and generate missing assets
        run: |
          python3 - <<'EOF'
          import glob, os

          # Fix broken XML files that have trailing content after </...>
          for xml_path in glob.glob("app/src/main/res/**/*.xml", recursive=True):
              with open(xml_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for tag in ["</vector>", "</shape>", "</layer-list>", "</selector>", "</resources>", "</adaptive-icon>"]:
                  idx = content.rfind(tag)
                  if idx != -1:
                      cleaned = content[:idx + len(tag)] + "\n"
                      if cleaned != content:
                          with open(xml_path, "w", encoding="utf-8") as f:
                              f.write(cleaned)
                      break
          EOF
          python3 -m pip install --upgrade pip pillow fonttools
          python3 - <<'EOF'
          import os
          from PIL import Image
          from fontTools.fontBuilder import FontBuilder
          from fontTools.pens.ttGlyphPen import TTGlyphPen

          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          art_path = "app/src/main/res/drawable/img_launcher_art.png"
          if not os.path.exists(art_path):
              Image.new("RGBA", (512, 512), (17, 21, 26, 255)).save(art_path)

          bg_path = "app/src/main/res/drawable/ic_launcher_background.xml"
          if not os.path.exists(bg_path):
              with open(bg_path, "w", encoding="utf-8") as f:
                  f.write('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="108dp"
    android:height="108dp"
    android:viewportWidth="108"
    android:viewportHeight="108">
    <path
        android:fillColor="#11151A"
        android:pathData="M0,0h108v108h-108z" />
</vector>
''')

          mipmap_dirs = [
              "app/src/main/res/mipmap-mdpi",
              "app/src/main/res/mipmap-hdpi",
              "app/src/main/res/mipmap-xhdpi",
              "app/src/main/res/mipmap-xxhdpi",
              "app/src/main/res/mipmap-xxxhdpi",
          ]
          for d in mipmap_dirs:
              os.makedirs(d, exist_ok=True)
              for name in ["ic_launcher.png", "ic_launcher_round.png"]:
                  p = os.path.join(d, name)
                  if not os.path.exists(p):
                      Image.new("RGBA", (192, 192), (30, 41, 59, 255)).save(p)

          font_dir = "app/src/main/res/font"
          os.makedirs(font_dir, exist_ok=True)
          font_names = [
              "jetbrains_mono.ttf",
              "noto_sans_myanmar.ttf",
              "noto_serif_myanmar.ttf",
              "padauk.ttf",
              "plus_jakarta_sans.ttf",
          ]

          def make_minimal_ttf(out_path, family_name):
              fb = FontBuilder(1000, isTTF=True)
              glyph_order = [".notdef", "space"]
              fb.setupGlyphOrder(glyph_order)

              pen = TTGlyphPen(None)
              pen.moveTo((100, 0))
              pen.lineTo((100, 700))
              pen.lineTo((500, 700))
              pen.lineTo((500, 0))
              pen.closePath()
              notdef_glyph = pen.glyph()

              space_pen = TTGlyphPen(None)
              space_glyph = space_pen.glyph()

              fb.setupGlyf({".notdef": notdef_glyph, "space": space_glyph})
              fb.setupCharacterMap({32: "space"})
              fb.setupHorizontalMetrics({
                  ".notdef": (600, 100),
                  "space": (400, 0),
              })
              fb.setupHorizontalHeader(ascent=800, descent=-200)
              fb.setupNameTable({
                  "familyName": family_name,
                  "styleName": "Regular",
              })
              fb.setupOS2(
                  sTypoAscender=800,
                  sTypoDescender=-200,
                  sTypoLineGap=100,
                  usWinAscent=800,
                  usWinDescent=200,
              )
              fb.setupPost()
              fb.save(out_path)

          for fname in font_names:
              fpath = os.path.join(font_dir, fname)
              if not os.path.exists(fpath):
                  make_minimal_ttf(fpath, os.path.splitext(fname)[0])
          EOF

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mini-recap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
